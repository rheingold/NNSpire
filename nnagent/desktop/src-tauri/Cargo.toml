[package]
name = "nnagent"
version = "0.1.0"
description = "NNSpire Agent - Conversational AI Workbench"
authors = ["NNSpire Team"]
license = "GPL-3.0"
repository = "https://github.com/nnspire/nnspire"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
